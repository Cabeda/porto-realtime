# fly.toml — PortoMove Worker (Python/DuckDB)
app = 'portomove-collector'
primary_region = 'cdg'

[build]
  dockerfile = "worker-py/Dockerfile"

[env]
  TZ = 'UTC'

# No http_service — this is a background worker, not a web server
[processes]
  worker = "python -m worker.main"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
