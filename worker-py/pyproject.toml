[project]
name = "portomove-worker"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.3",
    "httpx==0.28.1",
    "boto3==1.38.34",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
worker = "worker.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
